<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clinical Call</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <h1>Clinical Call</h1>
    <div class="pills" id="status">
      <span class="pill" data-key="deepgram">Deepgram: …</span>
      <span class="pill" data-key="openai">OpenAI: …</span>
    </div>
  </header>

  <main>
    <!-- ============ left: the call ============ -->
    <section class="stage card">
      <div class="row topbar">
        <label class="inline small muted" for="patient">Participant</label>
        <select id="patient" class="select" title="Participant"></select>
        <span class="pill" id="sessionPill">no session</span>
        <span class="pill" id="callStatus">idle</span>
        <span class="pill hidden" id="sttPill">STT</span>
      </div>

      <div id="conversation" class="messages tall" aria-live="polite"></div>

      <div class="controls">
        <button id="start" class="primary">Start call</button>
        <button id="mute" disabled>🎙️ Mute</button>
        <button id="end" disabled class="ghost">End call</button>
        <input id="typeInput" class="typeInput" placeholder="…or type a line (debug fallback)" autocomplete="off" />
      </div>
      <div id="error" class="error" hidden></div>
    </section>

    <!-- ============ right: what the brain is doing ============ -->
    <aside class="side">
      <section class="card side-card">
        <h2>Grounding <small>what the agent knows</small></h2>
        <div id="grounding"><p class="muted small">Starts with the call.</p></div>
      </section>

      <section class="card side-card">
        <h2>Brain &amp; planner</h2>
        <div id="brain"><p class="muted small">Starts with the call.</p></div>
      </section>

      <section class="card side-card">
        <h2>Session log <small>offline</small></h2>
        <div class="row">
          <button id="downloadLog" class="ghost small">⬇ Download log</button>
          <button id="clearLog" class="ghost small">Clear view</button>
          <span class="pill" id="logCount">0 events</span>
        </div>
        <div id="logList" class="loglist"></div>
      </section>
    </aside>
  </main>

  <script src="/app.js"></script>
</body>
</html>
