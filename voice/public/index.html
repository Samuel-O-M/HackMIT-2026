<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Clinical Call</title>
  <script>
    // Set the theme before first paint so the page never flashes the wrong one.
    (function () {
      try {
        var saved = localStorage.getItem('voice.theme');
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
    // Phone mode is decided before first paint so the layout never flashes.
    (function () {
      try {
        var savedMode = localStorage.getItem('voice.phoneMode');
        var isPhone = savedMode != null
          ? savedMode === '1'
          : (matchMedia('(max-width: 700px)').matches ||
             (matchMedia('(pointer: coarse)').matches && matchMedia('(max-width: 900px)').matches));
        document.documentElement.dataset.mode = isPhone ? 'phone' : 'desktop';
      } catch (e) {
        document.documentElement.dataset.mode = 'desktop';
      }
    })();
  </script>
  <link rel="stylesheet" href="/styles.css?v=4" />
</head>
<body>

  <!-- Ambient colour behind the glass. Transform-only animation, no blur filter. -->
  <div class="bg" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
    <span class="blob b4"></span>
  </div>

  <div class="app" id="app">

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <path d="M9.5 8.5v7M14.5 8.5v7M6 10v4M18 10v4" />
          </svg>
        </span>
        <span class="brand-name">Clinical Call</span>
        <span class="brand-site">Site 042</span>
      </div>
      <div class="top-actions">
        <button id="phoneToggle" class="icon-btn" aria-label="Phone layout" aria-pressed="false" title="Switch to phone layout">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="6.5" y="2.5" width="11" height="19" rx="3"/>
            <path d="M10.5 5.5h3"/>
            <path d="M12 18.3h.01"/>
          </svg>
        </button>
        <button id="devToggle" class="icon-btn" aria-label="Developer mode" aria-pressed="false" title="Developer mode">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.9 2.9-2.1-.7-.7-2.1 2.7-3.1z"/>
          </svg>
        </button>
        <button id="themeToggle" class="icon-btn" aria-label="Switch theme" title="Switch theme">
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2.5v2M12 19.5v2M4.3 4.3l1.4 1.4M18.3 18.3l1.4 1.4M2.5 12h2M19.5 12h2M4.3 19.7l1.4-1.4M18.3 5.7l1.4-1.4"/>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="stage">
      <!-- ===================== welcome ===================== -->
      <section class="welcome" id="welcomeView">
        <h1 class="welcome-title">Good to hear<br/>from you.</h1>
        <div class="welcome-form glass">
          <div class="phone-contact phone-only" aria-hidden="true">
            <div class="phone-contact-avatar">ST</div>
            <div class="phone-contact-name">Study team</div>
            <div class="phone-contact-sub">Clinical trial check-in</div>
          </div>
          <label class="who-label" for="patient">Who is on the call?</label>
          <div class="who-row">
            <select id="patient" class="who-select"></select>
            <button id="start" class="cta">
              <span class="cta-shine" aria-hidden="true"></span>
              <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M6.6 3.2c.7-.4 1.6-.1 2 .6l1 1.8c.4.7.3 1.6-.3 2.1L8 8.7a12.6 12.6 0 0 0 7.3 7.3l1-1.3c.5-.6 1.4-.7 2.1-.3l1.8 1c.7.4 1 1.3.6 2l-.9 1.8c-.5 1-1.7 1.5-2.7 1.1C9.9 17.8 6.2 14.1 3.7 6.8c-.4-1 .1-2.2 1.1-2.7l1.8-.9z"/></svg>
              <span>Start the call</span>
            </button>
          </div>
        </div>
      </section>

      <!-- ===================== in call ===================== -->
      <!-- Incoming call. Covers everything: a ringing phone is not one more
           panel on a page, it is the only thing the screen is doing. -->
      <section class="incoming hidden" id="incomingView" aria-live="assertive">
        <div class="incoming-inner">
          <p class="incoming-label">Incoming call</p>
          <p class="incoming-party" id="incomingParty">Study team</p>
          <p class="incoming-sub" id="incomingSub">Pre-visit medication review</p>
          <div class="incoming-acts">
            <button id="declineCall" class="round-btn decline" aria-label="Decline">
              <span class="round-glyph">&#10005;</span>
              <span class="round-label">Decline</span>
            </button>
            <button id="answerCall" class="round-btn answer" aria-label="Answer">
              <span class="round-glyph">&#9742;</span>
              <span class="round-label">Answer</span>
            </button>
          </div>
        </div>
      </section>

      <section class="call hidden" id="callView">
        <div class="phone-call-header phone-only" aria-live="polite">
          <div class="phone-party" id="phoneParty">Study team</div>
          <div class="phone-call-meta">
            <span id="phoneStatus">Connecting…</span>
            <span class="phone-timer" id="phoneTimer">00:00</span>
          </div>
        </div>
        <div class="status-line glass" id="status" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="statusText">Connecting…</span>
        </div>

        <div class="conversation" id="conversation" aria-live="polite" aria-label="Conversation so far"></div>

        <div class="dock glass">
          <div class="dock-row">
            <button id="mute" class="pill-btn" disabled>
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
              <span id="muteLabel">Mute</span>
            </button>

            <button type="button" class="pill-btn phone-only" data-ios="keypad" aria-label="Keypad">
              <svg viewBox="0 0 24 24" width="25" height="25" fill="currentColor" aria-hidden="true"><circle cx="7" cy="6" r="1.5"/><circle cx="12" cy="6" r="1.5"/><circle cx="17" cy="6" r="1.5"/><circle cx="7" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="17" cy="12" r="1.5"/><circle cx="7" cy="18" r="1.5"/><circle cx="12" cy="18" r="1.5"/><circle cx="17" cy="18" r="1.5"/></svg>
              <span>Keypad</span>
            </button>
            <button type="button" class="pill-btn phone-only" data-ios="speaker" aria-label="Speaker">
              <svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h3.5L12 18V6L8 9H4z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.2 6a8.5 8.5 0 0 1 0 12"/></svg>
              <span>Speaker</span>
            </button>

            <button id="end" class="pill-btn danger" disabled>
              <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true"><path d="M6.6 3.2c.7-.4 1.6-.1 2 .6l1 1.8c.4.7.3 1.6-.3 2.1L8 8.7a12.6 12.6 0 0 0 7.3 7.3l1-1.3c.5-.6 1.4-.7 2.1-.3l1.8 1c.7.4 1 1.3.6 2l-.9 1.8c-.5 1-1.7 1.5-2.7 1.1C9.9 17.8 6.2 14.1 3.7 6.8c-.4-1 .1-2.2 1.1-2.7l1.8-.9z" transform="rotate(135 12 12)"/></svg>
              End call
            </button>

            <button type="button" class="pill-btn phone-only" data-ios="add" aria-label="Add call">
              <svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="8" r="3.2"/><path d="M4.5 19a5.5 5.5 0 0 1 11 0"/><path d="M18 8v6M15 11h6"/></svg>
              <span>Add Call</span>
            </button>
            <button type="button" class="pill-btn phone-only" data-ios="facetime" aria-label="FaceTime">
              <svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6.5" width="12" height="11" rx="3"/><path d="M15 10.5l5-2.5v8l-5-2.5z"/></svg>
              <span>FaceTime</span>
            </button>
            <button type="button" class="pill-btn phone-only" data-ios="contacts" aria-label="Contacts">
              <svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.5 18.5a6 6 0 0 1 11 0"/></svg>
              <span>Contacts</span>
            </button>

            <button id="typeToggle" class="link-btn" aria-expanded="false">Type instead</button>
            <button id="backToStart" class="link-btn hidden">← Back to start</button>
          </div>
          <div class="type-row hidden" id="typeRow">
            <input id="typeInput" class="type-input" placeholder="Type what you'd say, then press Enter" autocomplete="off" />
            <button id="typeSend" class="cta small">Send</button>
          </div>
        </div>

        <button id="orb" class="orb" aria-label="Call in progress" disabled>
          <span class="orb-ring r1" aria-hidden="true"></span>
          <span class="orb-ring r2" aria-hidden="true"></span>
          <span class="orb-core" id="orbCore">
            <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <path d="M12 3a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/>
              <path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>
            </svg>
            <span class="orb-initials phone-only" aria-hidden="true">ST</span>
          </span>
        </button>
      </section>

      <div id="error" class="error" hidden role="alert"></div>
    </main>

    <!-- ===================== developer drawer ===================== -->
    <div class="dev-scrim" id="devScrim" hidden></div>
    <aside class="dev glass" id="devPanel" aria-label="Developer panel" hidden>
      <div class="dev-head">
        <div class="dev-title-row">
          <div class="dev-pills" id="healthPills">
            <span class="pill" data-key="deepgram">Deepgram …</span>
            <span class="pill" data-key="openai">OpenAI …</span>
            <span class="pill" id="sessionPill">no session</span>
          </div>
          <button id="devClose" class="dev-close" aria-label="Close developer panel" title="Close">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
              <path d="M6 6l12 12M18 6L6 18"/>
            </svg>
          </button>
        </div>
        <div class="dev-tabs" role="tablist">
          <button class="dev-tab active" data-tab="grounding" role="tab" aria-selected="true">Grounding</button>
          <button class="dev-tab" data-tab="brain" role="tab" aria-selected="false">Brain &amp; planner</button>
          <button class="dev-tab" data-tab="log" role="tab" aria-selected="false">Session log</button>
        </div>
      </div>

      <div class="dev-body">
        <div class="dev-page" data-page="grounding">
          <div id="grounding"><p class="muted small">Starts with the call.</p></div>
        </div>
        <div class="dev-page" data-page="brain" hidden>
          <div id="brain"><p class="muted small">Starts with the call.</p></div>
        </div>
        <div class="dev-page" data-page="log" hidden>
          <div class="log-actions">
            <button id="downloadLog" class="mini-btn">Download log</button>
            <button id="clearLog" class="mini-btn ghost">Clear view</button>
            <span class="pill" id="logCount">0 events</span>
          </div>
          <div id="logList" class="loglist"></div>
        </div>
      </div>
    </aside>

  </div>

  <script src="/app.js"></script>
</body>
</html>
